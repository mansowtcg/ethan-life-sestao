<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Vista del mapa convertido</title>
<style>html,body{margin:0;background:#1b1e24;color:#ddd;font:12px system-ui}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="../map.js"></script>
<script>
// Vista 2D del mapa convertido, para revisar la conversión. Parámetros: ?s=px por metro &x=&z= centro &l=1 etiquetas
const M = window.MAPDATA, q = new URLSearchParams(location.search), c = document.getElementById('c');
const B = M.bbox, S = +(q.get('s') || Math.min(innerWidth / (B[2] - B[0] + 120), innerHeight / (B[3] - B[1] + 120)));
const cx = +(q.get('x') || 0), cz = +(q.get('z') || 0); c.width = innerWidth; c.height = innerHeight;
const g = c.getContext('2d'), X = x => (x - cx) * S + c.width / 2, Z = z => (z - cz) * S + c.height / 2;
const poly = (p, fill, stroke) => { g.beginPath(); for (let i = 0; i < p.length; i += 2) i ? g.lineTo(X(p[i]), Z(p[i + 1])) : g.moveTo(X(p[i]), Z(p[i + 1])); g.closePath(); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1; g.stroke(); } };
const line = (p, col, w) => { g.beginPath(); for (let i = 0; i < p.length; i += 2) i ? g.lineTo(X(p[i]), Z(p[i + 1])) : g.moveTo(X(p[i]), Z(p[i + 1])); g.strokeStyle = col; g.lineWidth = Math.max(.6, w * S); g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(); };
g.fillStyle = '#b9b4a8'; g.fillRect(X(B[0]), Z(B[1]), (B[2] - B[0]) * S, (B[3] - B[1]) * S);
const GK = { park: '#7fb069', grass: '#93bd76', wood: '#4f8a4a', allot: '#a9b46a', pitch: '#3f9a63', play: '#d9a05b', pool: '#58b7e0', plaza: '#d8cfbd', lot: '#8d9096', yard: '#c9b99a', ind: '#a39c94', dirt: '#b59f7c', cem: '#9aa88c' };
const ord = ['ind', 'yard', 'dirt', 'grass', 'allot', 'park', 'wood', 'cem', 'lot', 'plaza', 'pitch', 'play', 'pool'];
ord.forEach(k => M.green.forEach(a => { if (a.k === k) poly(a.p, GK[k]); }));
M.water.forEach(p => poly(p, '#3f6f8f'));
const PED = { footway: 1, path: 1, steps: 1, cycleway: 1, pedestrian: 1 };
M.roads.forEach(r => { if (PED[r.t]) line(r.p, r.u ? '#77706a' : r.t === 'steps' ? '#c07b5a' : '#e8dfc9', r.w); });
M.roads.forEach(r => { if (!PED[r.t]) line(r.p, '#22252b', r.w + 3); });
M.roads.forEach(r => { if (!PED[r.t]) line(r.p, r.u ? '#555' : r.b ? '#8a8f99' : r.o ? '#5c6068' : '#6c7079', r.w); });
M.rail.forEach(p => line(p, '#3a2f2a', 1.6)); (M.train || []).forEach((p, i) => line(p, ['#e33', '#e83', '#ea3', '#3ae'][i], .8));
const BK = { ind: '#8d8378', civic: '#b88b6a', house: '#c7a17e', stand: '#999', roof: '#aeb7bd', chimney: '#b5523b' };
M.bld.forEach(b => poly(b.p, BK[b.k] || '#d6c1a3', '#5a4a3a'));
g.fillStyle = '#1f6b2c'; for (let i = 0; i < M.trees.length; i += 2) g.fillRect(X(M.trees[i]) - 1, Z(M.trees[i + 1]) - 1, 2.2, 2.2);
g.fillStyle = '#fff'; for (let i = 0; i < M.cross.length; i += 5) g.fillRect(X(M.cross[i]) - 1.5, Z(M.cross[i + 1]) - 1.5, 3, 3);
const PC = { bar: '#e74c3c', cafe: '#e67e22', rest: '#c0392b', fast: '#d35400', pharm: '#27ae60', bank: '#2980b9', super: '#8e44ad', fuel: '#f1c40f' };
M.poi.forEach(p => { g.fillStyle = PC[p[2]] || '#fff'; g.beginPath(); g.arc(X(p[0]), Z(p[1]), 2.2, 0, 7); g.fill(); });
M.transit.forEach(p => { g.fillStyle = p[2] === 'metro' ? '#f40' : '#06c'; g.fillRect(X(p[0]) - 4, Z(p[1]) - 4, 8, 8); });
if (q.get('l')) { g.font = 'bold 11px system-ui'; g.textAlign = 'center'; M.places.forEach(p => { g.fillStyle = '#000'; g.fillText(p[2], X(p[0]) + 1, Z(p[1]) + 1); g.fillStyle = '#ffec7a'; g.fillText(p[2], X(p[0]), Z(p[1])); });
  if (S > 1.5) { g.font = '9px system-ui'; const seen = new Set(); M.roads.forEach(r => { if (!r.n || PED[r.t] || seen.has(r.n)) return; seen.add(r.n); const i = (r.p.length >> 2) * 2; g.fillStyle = '#fff'; g.fillText(r.n, X(r.p[i]), Z(r.p[i + 1])); }); } }
g.strokeStyle = '#f0f'; g.lineWidth = 1; g.strokeRect(X(B[0]), Z(B[1]), (B[2] - B[0]) * S, (B[3] - B[1]) * S);
</script></body></html>
